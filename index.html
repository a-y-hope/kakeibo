<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>あそび帳セット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: same phone-first ledger as あそび帳2. Two groups (自由費 / 生活費) share one system; a segment switch picks which group's tap chips show, and the month view splits the total by group. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface2:#F4F6FB; --ink:#1A2038; --muted:#656C8A; --line:#DADFEC;
  --btn:#1A2038; --btn-ink:#FFFFFF; --danger:#C92B45; --focus:#4560E0;
  --c0:#E8512E; --c1:#C98A00; --c2:#1F9A56; --c3:#0C8FB3; --c4:#4560E0; --c5:#8B4FD6; --c6:#D93680; --c7:#6B7589; --c8:#8A6238;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --display:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141F; --surface:#1B2030; --surface2:#232940; --ink:#ECEFFA; --muted:#9AA2C0; --line:#2E3552;
    --btn:#E8EBFB; --btn-ink:#141829; --danger:#FF6F86; --focus:#8EA2FF;
    --c0:#FF8566; --c1:#FFC233; --c2:#46C985; --c3:#3CC0E2; --c4:#7B93FF; --c5:#B987F2; --c6:#F46FA8; --c7:#9AA5B8; --c8:#C49A6C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141F; --surface:#1B2030; --surface2:#232940; --ink:#ECEFFA; --muted:#9AA2C0; --line:#2E3552;
  --btn:#E8EBFB; --btn-ink:#141829; --danger:#FF6F86; --focus:#8EA2FF;
  --c0:#FF8566; --c1:#FFC233; --c2:#46C985; --c3:#3CC0E2; --c4:#7B93FF; --c5:#B987F2; --c6:#F46FA8; --c7:#9AA5B8; --c8:#C49A6C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:104px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#main{width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-size:22px;font-weight:400;margin:0;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--c1) 16%,var(--surface));border:1px solid var(--c1);border-radius:12px;padding:10px 12px;font-size:13px}

/* ticket */
.dayrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.arrow{width:40px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;line-height:1}
.ticket{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:84px}
.ticket::before,.ticket::after{content:"";position:absolute;left:85px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-8px;clip-path:inset(50% 0 0 0)}
.ticket::after{bottom:-8px;clip-path:inset(0 0 50% 0)}
.stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed var(--line);padding:8px 4px;cursor:pointer;border-radius:18px 0 0 18px}
.stub small{font-size:12px;color:var(--muted)}
.stub b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1}
.stub input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tmain{display:flex;flex-direction:column;justify-content:center;padding:10px 16px;min-width:0}
.tmain .lbl{font-size:12px;color:var(--muted)}
.tmain .tot{font-family:var(--display);font-size:28px;line-height:1.2}
.tmain .cnt{font-size:12px;color:var(--muted)}
.todaybtn{margin-top:4px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700}

.mjump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mjump button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700;font-size:13px}
/* group switch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.seg button{--cc:var(--c7);min-height:48px;border:0;border-radius:12px;background:transparent;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.seg button small{font-size:11px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 18%,var(--surface));box-shadow:inset 0 0 0 2px var(--cc)}

/* category cards + chips */
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.cat h2{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:900}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cc,var(--c7));flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--cc:var(--c7);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface2);font-weight:700;font-size:14px}
.chip .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.chip .tick svg{width:12px;height:12px;opacity:0;stroke:var(--bg);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.chip.on .tick{background:var(--cc);border-color:var(--cc)}
.chip.on .tick svg{opacity:1}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip .n{font-size:12px;font-weight:900;background:var(--cc);color:var(--bg);border-radius:999px;padding:0 7px;line-height:20px}
.chip.free{border-style:dashed;background:transparent;padding-left:14px;color:var(--muted)}
.chip.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.glabel{margin:4px 2px 0;font-size:12px;font-weight:900;color:var(--muted);width:100%}

/* lists */
h3.sec{margin:6px 2px 0;font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.06em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{min-width:0}
.row .t b{display:block;font-weight:700;overflow-wrap:anywhere}
.row .t small{color:var(--muted);font-size:12px}
.row .amt{font-weight:900}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px;font-size:12px;font-weight:900;color:var(--muted);background:var(--surface2);border-top:1px solid var(--line)}
.dayhead:first-child{border-top:0}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* month */
.mnav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.mnav .label{text-align:center;font-weight:900;font-size:16px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-family:var(--display);font-size:40px;line-height:1.1;letter-spacing:.01em;overflow-wrap:anywhere}
.hero .sub{font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{--cc:var(--c7);border-radius:14px;background:color-mix(in srgb,var(--cc) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--cc) 55%,var(--line));padding:10px 12px;min-width:0}
.split small{display:block;font-size:12px;font-weight:900;color:var(--muted)}
.split b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.3;overflow-wrap:anywhere}
.split span{font-size:12px;color:var(--muted)}
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;min-width:4px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;font-size:13px;font-weight:900;background:var(--surface2);border-top:1px solid var(--line)}
.ghead:first-child{border-top:0}
.crow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 14px;min-height:56px}
.crow.sel{background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.crow .nm{font-weight:700}
.crow .am{font-weight:900;text-align:right}
.crow .meta{grid-column:2 / 4;font-size:12px;color:var(--muted);display:flex;gap:10px}
.meter{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cc);border-radius:3px}
.filterbar{display:flex;align-items:center;gap:8px;font-size:13px}
.filterbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:700}

/* settings */
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.cathead{display:flex;align-items:center;gap:10px}
.field{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);padding:8px 12px;min-width:0}
.field:focus{border-color:var(--focus);outline:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);background:var(--cc);box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 108px 40px;gap:8px;align-items:center}
.iconbtn{width:40px;height:44px;border:0;background:transparent;border-radius:10px;font-size:20px;color:var(--muted)}
.btn{min-height:46px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:900;padding:8px 18px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.arm{background:var(--danger);color:#fff}
.hint{font-size:12px;color:var(--muted);margin:0}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.sheet label.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);min-height:44px}
.sheet label.chk input{width:22px;height:22px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.mini{min-height:44px;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:0 14px;font-weight:700;font-size:13px}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:0}
.yen{display:flex;align-items:center;gap:8px}
.yen span{font-family:var(--display);font-size:24px}
.yen .field{font-family:var(--display);font-size:24px}

/* balance */
.bal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.bal .lbl{font-size:12px;color:var(--muted);font-weight:700}
.bal .big{font-family:var(--display);font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.bal .big.neg{color:var(--danger)}
.bal .parts{display:flex;flex-direction:column;gap:0;font-size:12px;color:var(--muted);text-align:right}
.bal .note{flex-basis:100%;font-size:12px;color:var(--danger)}
.row .amt.inc{color:var(--c2)}
.ihead{display:flex;gap:8px;flex-wrap:wrap}
.crow:first-child{border-top:0}
.todaybtn{align-self:flex-start}
/* toast + nav */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{border:0;background:transparent;color:inherit;font-weight:900;text-decoration:underline;min-height:36px;padding:0 6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);min-height:52px;border-radius:14px;font-size:11px;font-weight:900}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
@media (prefers-reduced-motion: reduce){.chip.pop{animation:none}}

.brand{align-items:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.modes button{min-height:44px;border:0;border-radius:12px;background:transparent;font-weight:900;font-size:13px;padding:0 4px}
.modes button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
div.crow{cursor:default}
div.row{cursor:default}
</style>

<section id="app-play" class="app">
<div class="wrap">

  <div class="modes" role="group" aria-label="画面の切り替え"><button type="button" data-swap="play" aria-pressed="true">あそび帳</button><button type="button" data-swap="card" aria-pressed="false">クレカ帳</button><button type="button" data-swap="sum" aria-pressed="false">自由費合算</button></div>

<script>(function(){
  var A=document.getElementById("app-play"), B=document.getElementById("app-card"), S=document.getElementById("app-sum"), K="asobicho:last";
  function save(w){
    try{sessionStorage.setItem(K,w)}catch(e){}
    try{localStorage.setItem(K,w)}catch(e){}
  }
  function load(){
    var v=null;
    try{v=sessionStorage.getItem(K)}catch(e){}
    if(!v){try{v=localStorage.getItem(K)}catch(e){}}
    return (v==="card"||v==="sum")?v:"play";
  }
  function show(w){
    A.hidden=(w!=="play"); B.hidden=(w!=="card"); S.hidden=(w!=="sum");
    save(w);
    window.scrollTo(0,0);
    if(w==="sum") document.dispatchEvent(new Event("sumshow"));
  }
  show(load());
  document.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-swap]"); if(t) show(t.dataset.swap);
  });
})();</script>
<script>
(function(){
"use strict";
var C = window.claude;
var ROOT = document.getElementById("app-play");
var APP_TITLE = "あそび帳";
var $ = function(s){return ROOT.querySelector(s)};
var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var pad = function(n){return String(n).padStart(2,"0")};
var fmtDate = function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var parseDate = function(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
var WD = "日月火水木金土";
var yen = function(n){return "¥"+Math.round(n).toLocaleString("ja-JP")};
var todayStr = function(){return fmtDate(new Date())};
var monthOf = function(s){return s.slice(0,7)};
var addMonths = function(ym,k){var p=ym.split("-").map(Number);var d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
var rid = function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var toAscii = function(s){return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)})};
var parseAmounts = function(s){
  var parts=toAscii(s).split(/[\s、]+/).filter(Boolean);
  if(!parts.length) return null;
  var out=[];
  for(var i=0;i<parts.length;i++){var v=parseAmount(parts[i]);if(!(v>0)) return null;out.push(v)}
  return out;
};
var parseAmount = function(s){var t=toAscii(s).replace(/[,，\s¥円]/g,"");return /^\d+$/.test(t)?parseInt(t,10):NaN};
var CHECK = '<svg viewBox="0 0 12 12"><path d="M2.2 6.4l2.6 2.6 5-5.6"/></svg>';

var DEFAULT_CATS = [
  ["c_food","外食",0,["ラーメン","カフェ","ランチ","居酒屋","ファストフード"]],
  ["c_cloth","服・美容",6,["服","靴・小物","美容院","コスメ"]],
  ["c_game","ゲーム",4,["ソフト","課金","ゲーセン"]],
  ["c_book","本・漫画",1,["漫画","本","電子書籍"]],
  ["c_show","映画・ライブ",5,["映画","ライブ","イベント"]],
  ["c_hobby","趣味",3,["道具・材料","カラオケ"]],
  ["c_trip","お出かけ",2,["交通費","入場料","お土産"]],
  ["c_sub","サブスク",7,["動画","音楽"]]
].map(function(a){return {id:a[0],name:a[1],color:a[2],presets:a[3].map(function(n,i){return {id:"p_"+a[0]+"_"+i,name:n,amount:null}})}});

var cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
var DEFAULT_INCOME = ["お小遣い","給料","バイト","臨時収入"].map(function(n,i){return {id:"i_"+i,name:n,amount:null}});
var income = JSON.parse(JSON.stringify(DEFAULT_INCOME));
var start = {date:"",amount:0};
var balEntries = [], balKey = null, unsubBal = null, balLoaded = false;
var isInc = function(e){return e&&e.type==="income"};
var settingsObj = function(){return {cats:cats,income:income,start:start,v:2}};
var LS_KEY = "asobicho:v2";
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({entries:entries,settings:settingsObj()}))}catch(e){}}
function lsLoad(){
  try{
    var r=localStorage.getItem(LS_KEY); if(!r) return;
    var o=JSON.parse(r);
    if(Array.isArray(o.entries)) entries=o.entries;
    var s=o.settings;
    if(s){
      if(Array.isArray(s.cats)) cats=s.cats;
      if(Array.isArray(s.income)) income=s.income;
      if(s.start&&typeof s.start==="object") start=s.start;
    }
  }catch(e){}
}
var entries = [];
var view = {tab:"add", date:todayStr(), month:monthOf(todayStr()), filter:null};
var loaded = false, slow = false, local = false;
var uid = null, db = null, entriesRef = null, profileRef = null;
var unsubEntries = null, rangeKey = "", slowTimer = null;
var sheetState = null, popId = null, armed = null, armTimer = null, lastUndo = null, toastTimer = null;
var saving = Promise.resolve();

function catById(id){for(var i=0;i<cats.length;i++){if(cats[i].id===id)return cats[i]}return null}
function catLabel(e){if(isInc(e))return "収入";var c=catById(e.catId);return c?c.name:(e.cat||"未分類")}
function catColor(e){if(isInc(e))return 2;var c=catById(e.catId);return c?c.color:7}
function sortEntries(a){return a.slice().sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:(y.ts||0)-(x.ts||0)})}
function sum(a){return a.reduce(function(t,e){return t+(e.amount||0)},0)}
function showErr(err){toast("保存できませんでした。通信を確認してください")}

/* ---------- data ---------- */
function ensureRange(){
  if(!entriesRef) return;
  var a=monthOf(view.date), b=view.month;
  var lo=a<b?a:b, hi=a<b?b:a;
  var from=addMonths(lo,-1)+"-01", to=addMonths(hi,1)+"-01";
  var key=from+"|"+to;
  if(key===rangeKey) return;
  rangeKey=key;
  if(unsubEntries) unsubEntries();
  loaded=false; slow=false;
  clearTimeout(slowTimer);
  slowTimer=setTimeout(function(){if(!loaded){slow=true;render()}},10000);
  unsubEntries=entriesRef.where("date",">=",from).where("date","<",to).orderBy("date","desc").limit(1000).onSnapshot(function(snap){
    entries=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
    loaded=true;slow=false;clearTimeout(slowTimer);
    render();
  },function(err){loaded=true;slow=false;showErr(err);render()});
}
function ensureBalance(){
  if(!entriesRef) return;
  var key=start.date||"";
  if(key===balKey) return;
  balKey=key;
  if(unsubBal) unsubBal();
  balLoaded=false;
  unsubBal=entriesRef.where("date",">=",key||"0000-01-01").orderBy("date","desc").limit(1000).onSnapshot(function(snap){
    balEntries=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
    balLoaded=true;
    render();
  },function(err){balLoaded=true;showErr(err);render()});
}
function balanceInfo(){
  var src=entriesRef?balEntries:entries, inc=0, exp=0;
  src.forEach(function(e){
    if(start.date&&e.date<start.date) return;
    if(isInc(e)) inc+=e.amount||0; else exp+=e.amount||0;
  });
  var base=start.amount||0;
  return {base:base,inc:inc,exp:exp,bal:base+inc-exp,capped:!!entriesRef&&balEntries.length>=1000};
}
function addEntry(e){
  var id="e"+rid();
  var doc={type:e.type==="income"?"income":"expense",date:e.date,catId:e.catId||null,cat:e.cat||"",item:e.item||"",amount:e.amount,memo:e.memo||"",presetId:e.presetId||null,ts:e.ts||Date.now()};
  if(entriesRef){entriesRef.doc(id).set(doc).catch(showErr)}
  else{var o=Object.assign({id:id},doc);entries.push(o);lsSave();render()}
  return id;
}
function updateEntry(id,patch){
  if(entriesRef){entriesRef.doc(id).update(patch).catch(showErr)}
  else{entries=entries.map(function(e){return e.id===id?Object.assign({},e,patch):e});lsSave();render()}
}
function removeEntry(id){
  if(entriesRef){entriesRef.doc(id).delete().catch(showErr)}
  else{entries=entries.filter(function(e){return e.id!==id});lsSave();render()}
}
function saveSettings(){
  if(!profileRef){lsSave();return}
  var snap=JSON.parse(JSON.stringify(settingsObj()));
  saving=saving.then(function(){return profileRef.set(snap)}).catch(showErr);
}

/* ---------- toast ---------- */
function toast(msg,undoId){
  var el=$("#toast");
  clearTimeout(toastTimer);
  lastUndo=undoId||null;
  el.innerHTML="<span>"+esc(msg)+"</span>"+(undoId?'<button data-act="undo">取り消し</button>':"");
  el.hidden=false;
  toastTimer=setTimeout(function(){el.hidden=true;lastUndo=null},5000);
}

/* ---------- render ---------- */
function render(){
  renderBal();
  ROOT.querySelectorAll("nav.tabs button").forEach(function(b){
    if(b.dataset.tab===view.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  var m=$("#main");
  m.innerHTML = view.tab==="add"?renderAdd():view.tab==="month"?renderMonth():renderSettings();
  popId=null;
}
function renderBal(){
  var el=$("#bal"); if(!el) return;
  if(entriesRef&&!balLoaded){el.innerHTML='<div><div class="lbl">残金</div><div class="big num">…</div></div>';return}
  var b=balanceInfo(), neg=b.bal<0;
  el.innerHTML='<div><div class="lbl">残金</div><div class="big num'+(neg?" neg":"")+'">'+(neg?"−":"")+yen(Math.abs(b.bal))+'</div></div>'+
    '<div class="parts num"><span>'+(start.date?"起点 ":"繰越 ")+yen(b.base)+'</span><span>収入 ＋'+yen(b.inc)+'</span><span>支出 −'+yen(b.exp)+'</span></div>'+
    (b.capped?'<div class="note">記録が1000件を超えたため、残金は概算です。設定で起点を更新してください</div>':"");
}
function entryRow(e){
  var inc=isInc(e);
  return '<button class="row" data-act="edit" data-id="'+esc(e.id)+'" style="--cc:var(--c'+catColor(e)+')"><span class="dot"></span>'+
    '<span class="t"><b>'+esc(e.item||catLabel(e))+'</b><small>'+esc(catLabel(e))+(e.memo?" ・ "+esc(e.memo):"")+'</small></span>'+
    '<span class="amt num'+(inc?" inc":"")+'">'+(inc?"＋":"")+yen(e.amount)+'</span></button>';
}
function renderAdd(){
  var d=parseDate(view.date), isToday=view.date===todayStr();
  var day=sortEntries(entries.filter(function(e){return e.date===view.date}));
  var counts={};
  day.forEach(function(e){if(e.presetId)counts[e.presetId]=(counts[e.presetId]||0)+1});
  var h='<div class="dayrow"><button class="arrow" data-act="day" data-d="-1" aria-label="前の日">‹</button>'+
    '<div class="ticket"><label class="stub"><small>'+(d.getMonth()+1)+'月 '+WD[d.getDay()]+'曜</small><b class="num">'+d.getDate()+'</b>'+
    '<input type="date" id="dpick" value="'+esc(view.date)+'" aria-label="日付を選ぶ"></label>'+
    '<div class="tmain"><span class="lbl">'+(isToday?"今日の支出":d.getMonth()+1+"/"+d.getDate()+"の支出")+'</span><span class="tot num">'+yen(sum(day.filter(function(e){return !isInc(e)})))+'</span>'+
    '<span class="cnt">'+day.length+'件'+(isToday?"":' <button class="todaybtn" data-act="today">今日へ</button>')+'</span></div></div>'+
    '<button class="arrow" data-act="day" data-d="1" aria-label="次の日">›</button></div>';
  var pm=addMonths(monthOf(view.date),-1).split("-"), nm=addMonths(monthOf(view.date),1).split("-");
  h+='<div class="mjump"><button data-act="mjump" data-d="-1">‹ 前月 '+Number(pm[1])+'月1日へ</button><button data-act="mjump" data-d="1">翌月 '+Number(nm[1])+'月1日へ ›</button></div>';
  h+='<h3 class="sec">タップで記録</h3>';
  cats.forEach(function(c){
    h+='<section class="cat" style="--cc:var(--c'+c.color+')"><h2><span class="dot"></span>'+esc(c.name)+'</h2><div class="chips">';
    c.presets.forEach(function(p){
      var n=counts[p.id]||0;
      h+='<button class="chip'+(n?" on":"")+(popId===p.id?" pop":"")+'" style="--cc:var(--c'+c.color+')" data-act="preset" data-cat="'+esc(c.id)+'" data-p="'+esc(p.id)+'">'+
        '<span class="tick">'+CHECK+'</span>'+esc(p.name)+(p.amount>0?' <small class="num">'+yen(p.amount)+'</small>':"")+(n>1?' <span class="n">×'+n+'</span>':"")+'</button>';
    });
    h+='<button class="chip free" data-act="free" data-cat="'+esc(c.id)+'">＋ 自由入力</button></div></section>';
  });
  if(!cats.length) h+='<div class="empty">分類がありません。設定タブで追加できます。</div>';
  h+='<h3 class="sec">収入</h3><section class="cat" style="--cc:var(--c2)"><h2><span class="dot"></span>入ったお金</h2><div class="chips">';
  income.forEach(function(p){
    var n=counts[p.id]||0;
    h+='<button class="chip'+(n?" on":"")+(popId===p.id?" pop":"")+'" style="--cc:var(--c2)" data-act="ipreset" data-p="'+esc(p.id)+'">'+
      '<span class="tick">'+CHECK+'</span>'+esc(p.name)+(p.amount>0?' <small class="num">＋'+yen(p.amount)+'</small>':"")+(n>1?' <span class="n">×'+n+'</span>':"")+'</button>';
  });
  h+='<button class="chip free" data-act="ifree">＋ 収入を入力</button></div></section>';
  h+='<h3 class="sec">この日の記録</h3><div class="list">';
  if(!loaded&&entriesRef&&!day.length) h+='<div class="empty">'+(slow?"読み込みに時間がかかっています。通信を確認してください":"読み込み中…")+'</div>';
  else if(!day.length) h+='<div class="empty">まだ記録がありません。上の項目をタップすると追加されます。</div>';
  else h+=day.map(entryRow).join("");
  return h+'</div>';
}
function renderMonth(){
  var ym=view.month, p=ym.split("-");
  var curAll=entries.filter(function(e){return monthOf(e.date)===ym});
  var cur=curAll.filter(function(e){return !isInc(e)});
  var incs=curAll.filter(isInc);
  var prev=entries.filter(function(e){return monthOf(e.date)===addMonths(ym,-1)&&!isInc(e)});
  var total=sum(cur), ptotal=sum(prev), itotal=sum(incs);
  var groups={};
  cur.forEach(function(e){var k=e.catId||("x:"+(e.cat||""));var g=groups[k]||(groups[k]={key:k,name:catLabel(e),color:catColor(e),amount:0,count:0});g.amount+=e.amount||0;g.count++});
  var rows=Object.keys(groups).map(function(k){return groups[k]}).sort(function(a,b){return b.amount-a.amount});
  var h='<div class="mnav"><button class="arrow" data-act="month" data-d="-1" aria-label="前の月">‹</button><div class="label">'+p[0]+'年'+Number(p[1])+'月</div><button class="arrow" data-act="month" data-d="1" aria-label="次の月">›</button></div>';
  if(!loaded&&entriesRef) return h+'<div class="hero"><div class="sub">'+(slow?"読み込みに時間がかかっています。通信を確認してください":"読み込み中…")+'</div></div>';
  var delta="";
  if(ptotal>0){var df=total-ptotal;delta="先月より "+(df>=0?"+":"−")+yen(Math.abs(df))+"(先月 "+yen(ptotal)+")"}
  else delta="先月の支出記録はありません";
  var net=itotal-total;
  h+='<div class="hero"><div><div class="sub">この月に使った額</div><div class="big num">'+yen(total)+'</div></div><div class="sub">'+cur.length+'件 ・ '+esc(delta)+'</div>'+
    '<div class="sub num">収入 ＋'+yen(itotal)+' ・ 収支 '+(net>=0?"＋":"−")+yen(Math.abs(net))+'</div>';
  if(rows.length) h+='<div class="stack" aria-hidden="true">'+rows.map(function(r){return '<i style="flex:'+r.amount+';background:var(--c'+r.color+')"></i>'}).join("")+'</div>';
  h+='</div>';
  if(!curAll.length) return h+'<div class="list"><div class="empty">この月の記録はまだありません。記録タブで項目をタップすると追加されます。</div></div>';
  if(rows.length){
    h+='<h3 class="sec">分類ごと(タップで絞り込み)</h3><div class="list">';
    rows.forEach(function(r){
      var pct=total>0?Math.round(r.amount/total*100):0;
      h+='<button class="crow'+(view.filter===r.key?" sel":"")+'" style="--cc:var(--c'+r.color+')" data-act="filter" data-k="'+esc(r.key)+'"><span class="dot"></span><span class="nm">'+esc(r.name)+'</span><span class="am num">'+yen(r.amount)+'</span>'+
        '<span class="meter"><i style="width:'+pct+'%"></i></span><span class="meta num"><span>'+pct+'%</span><span>'+r.count+'件</span></span></button>';
    });
    h+='</div>';
  }
  var list=sortEntries(curAll);
  if(view.filter){
    list=list.filter(function(e){return !isInc(e)&&(e.catId||("x:"+(e.cat||"")))===view.filter});
    var g=groups[view.filter];
    h+='<div class="filterbar"><span>絞り込み中:'+esc(g?g.name:"")+'</span><button data-act="filter" data-k="">解除</button></div>';
  }
  h+='<h3 class="sec">明細</h3><div class="list">';
  var last="";
  list.forEach(function(e){
    if(e.date!==last){
      last=e.date;
      var dd=parseDate(e.date);
      var dayTotal=sum(list.filter(function(x){return x.date===e.date&&!isInc(x)}));
      h+='<div class="dayhead"><span>'+(dd.getMonth()+1)+'月'+dd.getDate()+'日('+WD[dd.getDay()]+')</span><span class="num">支出 '+yen(dayTotal)+'</span></div>';
    }
    h+=entryRow(e);
  });
  return h+'</div>';
}

  var h='<p class="hint">分類とタップ用の項目を自分好みに変えられます。金額を入れた項目は、タップするだけでその金額で記録されます。空欄なら、タップするたびに金額を聞かれます。</p>';

      '<div class="swatches" role="group" aria-label="色">'+[0,1,2,3,4,5,6,7,8].map(function(i){return '<button class="sw'+(i===c.color?" on":"")+'" style="--cc:var(--c'+i+')" data-act="color" data-cat="'+esc(c.id)+'" data-i="'+i+'" aria-label="色'+(i+1)+'"></button>'}).join("")+'</div>';
    c.presets.forEach(function(p){
      h+='<div class="prow"><input class="field" data-f="pname" data-cat="'+esc(c.id)+'" data-p="'+esc(p.id)+'" value="'+esc(p.name)+'" aria-label="項目名" maxlength="20">'+
        '<input class="field num" inputmode="numeric" data-f="pamt" data-cat="'+esc(c.id)+'" data-p="'+esc(p.id)+'" value="'+(p.amount>0?p.amount:"")+'" placeholder="毎回入力" aria-label="いつもの金額(円)">'+
        '<button class="iconbtn" data-act="delpreset" data-cat="'+esc(c.id)+'" data-p="'+esc(p.id)+'" aria-label="項目を削除">×</button></div>';
    });
    var k="cat:"+c.id;
    h+='<div class="rowbtns"><button class="btn ghost" data-act="addpreset" data-cat="'+esc(c.id)+'">＋ 項目を追加</button>'+
      '<button class="btn danger'+(armed===k?" arm":"")+'" data-act="delcat" data-cat="'+esc(c.id)+'">'+(armed===k?"もう一度押すと削除":"この分類を削除")+'</button></div>'+
      '</section>';
  });
  h+='<button class="btn" data-act="addcat">＋ 分類を追加</button>';
  h+='<h3 class="sec">データ</h3><div class="catcard"><p class="hint">過去の記録はCSVとして保存できます。スマホで保存できないときは「表をコピー」で、メモやスプレッドシートに貼り付けられます(どちらも新しい順に最大1000件)。分類や項目を削除しても、すでにある記録は消えません。</p><div class="rowbtns"><button class="btn ghost" data-act="csv">CSVを保存</button><button class="btn ghost" data-act="pdf">PDFを保存</button><button class="btn ghost" data-act="tsv">表をコピー</button><button class="btn ghost" data-act="import">記録を取り込む</button></div><p class="hint" style="margin-top:8px">機種変更のときは、今の端末で「CSVを保存」か「表をコピー」で残しておき、新しい端末で「記録を取り込む」から戻せます。</p></div>';
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html,focusSel){
  $("#sheet").innerHTML=html; $("#scrim").hidden=false; document.body.style.overflow="hidden";
  setTimeout(function(){var f=focusSel&&$("#sheet "+focusSel);if(f){f.focus();if(f.select)f.select()}},60);
}
function closeSheet(){ $("#scrim").hidden=true; $("#sheet").innerHTML=""; sheetState=null; document.body.style.overflow=""; }
function catChips(sel){
  return cats.map(function(c){return '<button type="button" class="chip'+(c.id===sel?" on":"")+'" style="--cc:var(--c'+c.color+')" data-act="selcat" data-cat="'+esc(c.id)+'"><span class="tick">'+CHECK+'</span>'+esc(c.name)+'</button>'}).join("")+
    '<button type="button" class="chip'+(sel===""?" on":"")+'" style="--cc:var(--c7)" data-act="selcat" data-cat=""><span class="tick">'+CHECK+'</span>未分類</button>';
}
function entrySheet(e,mode){
  var inc=isInc(e);
  sheetState={mode:mode,id:e.id||null,catId:e.catId==null?"":e.catId,income:inc};

async function copyTsv(){
  var ta=$("#f-tsv"), err=$("#f-err"), ok=false;
  var done=function(){err.style.color="var(--muted)";err.textContent="コピーしました。スプレッドシートで空いているセルを選んで貼り付けてください"};
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      var item=new ClipboardItem({"text/plain":new Blob([ta.value],{type:"text/plain"}),"text/html":new Blob([htmlTable(lastRows)],{type:"text/html"})});
      await navigator.clipboard.write([item]);ok=true;
    }
  }catch(e){ok=false}
  if(!ok){try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}}
  if(ok){done();return}
  try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);if(document.execCommand("copy")){done();return}}catch(e){}

function pairMemos(n,memo){
  if(n<=1) return [memo];
  var parts=memo.split(/[\s、]+/).filter(Boolean), out=[], k;
  if(parts.length===0){for(k=0;k<n;k++)out.push("");return out}
  if(parts.length===1){for(k=0;k<n;k++)out.push(parts[0]);return out}
  return parts.length===n?parts:null;
}

async function makePdf(rows){
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready}catch(e){}}

  var heads=pdfHeads();
  var cols=[{w:150,a:"l",ml:1},{w:100,a:"l",ml:1},{w:200,a:"l",ml:2},{w:236,a:"l",ml:2},{w:150,a:"r",ml:1},{w:0,a:"l",ml:2}];
  var used=0; cols.forEach(function(c,i){if(i<5)used+=c.w});
  cols[5].w=W-2*M-used;
  var title=APP_TITLE, now=new Date();
  var stamp=now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 出力";
  function font(px,wt){g.font=wt+" "+px+"px "+fam}
  function wrap(text,maxW,maxLines){
    text=String(text==null?"":text);
    var lines=[],cur="",ch;
    var chars=Array.from(text);
    for(var i=0;i<chars.length;i++){

    var x=M;
    for(var i=0;i<6;i++){

        }
        xx+=cols[i].w;
      }

    jpegs.push(await canvasJpeg(cv));

function buildPdf(jpegs,W,H){
  var enc=new TextEncoder(), parts=[], offs=[], len=0, n=jpegs.length, objCount=2+n*3;
  function push(u8){parts.push(u8);len+=u8.length}
  function pushS(s){push(enc.encode(s))}
  function obj(id,fn){offs[id]=len;pushS(id+" 0 obj\n");fn();pushS("\nendobj\n")}
  pushS("%PDF-1.4\n");
  obj(1,function(){pushS("<< /Type /Catalog /Pages 2 0 R >>")});
  var kids=[]; for(var i=0;i<n;i++) kids.push((3+3*i)+" 0 R");
  obj(2,function(){pushS("<< /Type /Pages /Count "+n+" /Kids ["+kids.join(" ")+"] >>")});
  jpegs.forEach(function(jp,i){
    var pid=3+3*i, cid=4+3*i, iid=5+3*i, content="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pid,function(){pushS("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>")});
    obj(cid,function(){pushS("<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream")});
    obj(iid,function(){
      pushS("<< /Type /XObject /Subtype /Image /Width "+W+" /Height "+H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jp.length+" >>\nstream\n");
      push(jp); pushS("\nendstream");
    });
  });
  var xo=len;
  pushS("xref\n0 "+(objCount+1)+"\n0000000000 65535 f \n");
  for(var id=1;id<=objCount;id++) pushS(String(offs[id]).padStart(10,"0")+" 00000 n \n");
  pushS("trailer\n<< /Size "+(objCount+1)+" /Root 1 0 R >>\nstartxref\n"+xo+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}

var IMP={rows:null,res:null};
function impIsCard(){return typeof GROUPS!=="undefined"}
function impParse(text){
  text=String(text||"").replace(/^﻿/,"");
  var first=text.split(/\r?\n/)[0]||"";
  var delim=first.indexOf("\t")>=0?"\t":",";
  var rows=[],row=[],cur="",q=false,i,ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=ch;
    }else if(ch==='"'&&cur===""){q=true}
    else if(ch===delim){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(cur);cur="";
      if(row.length>1||row[0]!=="")rows.push(row);
      row=[];
    }else cur+=ch;
  }
  row.push(cur);
  if(row.length>1||row[0]!=="")rows.push(row);
  return rows;
}
function impZen(s){return String(s==null?"":s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[，、]/g,",").replace(/[－ー−‐]/g,"-")}
function impDate(s){
  s=impZen(s).trim();
  var m=s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  var t=new Date(y,mo-1,d);
  if(t.getMonth()!==mo-1)return null;
  return y+"-"+(mo<10?"0":"")+mo+"-"+(d<10?"0":"")+d;
}
function impAmount(s){
  s=impZen(s).replace(/[¥￥円,\s]/g,"");
  if(!/^\d+(\.\d+)?$/.test(s))return null;
  var n=Math.round(parseFloat(s));
  return n>0?n:null;
}
function impEntryKey(o){return [o.date,o.k,o.label,o.item,o.amount,o.memo].join("\u0001")}
function impBuild(rows){
  var idx={date:0,kind:1,cat:2,item:3,amount:4,memo:5}, hs=0, startRow=null;
  if(rows.length&&rows[0].some(function(c){return String(c).trim()==="日付"})){
    var h=rows[0].map(function(c){return String(c).trim()});
    var find=function(names,def){for(var i=0;i<h.length;i++){if(names.indexOf(h[i])>=0)return i}return def};
    idx={date:find(["日付"],0),kind:find(["種別","区分"],1),cat:find(["分類"],2),item:find(["項目"],3),amount:find(["金額"],4),memo:find(["メモ"],5)};
    hs=1;
  }
  var card=impIsCard(), out=[], bad=0;
  for(var r=hs;r<rows.length;r++){
    var c=rows[r];
    if(!card&&String(c[idx.kind]==null?"":c[idx.kind]).trim()==="はじまり"){var sa=impAmount(c[idx.amount]);if(sa)startRow={date:impDate(c[idx.date])||"",amount:sa};else bad++;continue}
    var date=impDate(c[idx.date]), amt=impAmount(c[idx.amount]);
    if(!date||!amt){bad++;continue}
    var kind=String(c[idx.kind]==null?"":c[idx.kind]).trim(), label=String(c[idx.cat]==null?"":c[idx.cat]).trim();
    var item=String(c[idx.item]==null?"":c[idx.item]).trim(), memo=String(c[idx.memo]==null?"":c[idx.memo]).trim();
    var o={date:date,amount:amt,item:item,memo:memo};
    if(card){
      var g=null;
      if(kind==="生活費")g="life";
      else if(kind==="自由費"||kind==="自由費")g="play";
      else GROUPS.forEach(function(x){if(x.name===kind)g=x.id});
      var cat=null;
      cats.forEach(function(x){if(x.name===label&&(!g||x.group===g)&&!cat)cat=x});
      if(!g)g=cat?cat.group:"play";
      o.grp=g;o.k=g;o.label=label||(cat?cat.name:"");o.catId=cat?cat.id:null;o.cat=label;
    }else{
      if(kind==="収入"||(!kind&&label==="収入")){o.type="income";o.k="income";o.label="収入";o.catId=null;o.cat=""}
      else{
        var cat2=null;
        cats.forEach(function(x){if(x.name===label&&!cat2)cat2=x});
        o.type="expense";o.k="expense";o.label=label||"未分類";o.catId=cat2?cat2.id:null;o.cat=label;

}
function impExisting(items){
  return new Promise(function(res){
    if(!items.length){res([]);return}
    if(!entriesRef){res(entries.slice());return}
    var lo=items[0].date,hi=items[0].date;
    items.forEach(function(o){if(o.date<lo)lo=o.date;if(o.date>hi)hi=o.date});
    var hi2=hi.slice(0,8)+"31";
    entriesRef.where("date",">=",lo).where("date","<=",hi2).orderBy("date","desc").limit(1000).get().then(function(snap){
      res(snap.docs.map(function(d){return d.data()}));
    },function(){res([])});
  });
}
function impExKey(e){
  var card=impIsCard();
  if(card)return impEntryKey({date:e.date,k:entGrp(e),label:catLabel(e),item:e.item||"",amount:e.amount,memo:e.memo||""});
  var inc=isInc(e);
  return impEntryKey({date:e.date,k:inc?"income":"expense",label:inc?"収入":catLabel(e),item:e.item||"",amount:e.amount,memo:e.memo||""});
}
function impPlan(items){
  return impExisting(items).then(function(ex){
    var have={};
    ex.forEach(function(e){var k=impExKey(e);have[k]=(have[k]||0)+1});
    var add=[],dup=0;
    items.forEach(function(o){
      var k=impEntryKey(o);
      if(have[k]>0){have[k]--;dup++}else add.push(o);
    });
    return {add:add,dup:dup};
  });
}
function impOpen(msg){

var LS_KEY = "kurecha:v1";
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({entries:entries,settings:settingsObj()}))}catch(e){}}
function lsLoad(){
  try{
    var r=localStorage.getItem(LS_KEY); if(!r) return;
    var o=JSON.parse(r);

    if(o.settings&&Array.isArray(o.settings.cats)) cats=o.settings.cats;
  }catch(e){}

function catById(id){for(var i=0;i<cats.length;i++){if(cats[i].id===id)return cats[i]}return null}
function entGrp(e){if(e.grp==="life"||e.grp==="play")return e.grp;var c=catById(e.catId);return c?c.group:"play"}
function catLabel(e){var c=catById(e.catId);return c?c.name:(e.cat||"未分類")}
function catColor(e){var c=catById(e.catId);return c?c.color:gColor(entGrp(e))}
function sortEntries(a){return a.slice().sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:(y.ts||0)-(x.ts||0)})}
function sum(a){return a.reduce(function(t,e){return t+(e.amount||0)},0)}
function sumG(a,g){return sum(a.filter(function(e){return entGrp(e)===g}))}
function showErr(err){toast("保存できませんでした。通信を確認してください")}

/* ---------- data ---------- */
function ensureRange(){
  if(!entriesRef) return;
  var a=monthOf(view.date), b=view.month;
  var lo=a<b?a:b, hi=a<b?b:a;
  var from=addMonths(lo,-1)+"-01", to=addMonths(hi,1)+"-01";
  var key=from+"|"+to;
  if(key===rangeKey) return;
  rangeKey=key;
  if(unsubEntries) unsubEntries();
  loaded=false; slow=false;
  clearTimeout(slowTimer);
  slowTimer=setTimeout(function(){if(!loaded){slow=true;render()}},10000);
  unsubEntries=entriesRef.where("date",">=",from).where("date","<",to).orderBy("date","desc").limit(1000).onSnapshot(function(snap){
    entries=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
    loaded=true;slow=false;clearTimeout(slowTimer);
    render();
  },function(err){loaded=true;slow=false;showErr(err);render()});
}
function addEntry(e){
  var id="e"+rid();
  var doc={date:e.date,catId:e.catId||null,cat:e.cat||"",grp:e.grp||"play",item:e.item||"",amount:e.amount,memo:e.memo||"",presetId:e.presetId||null,ts:e.ts||Date.now()};
  if(entriesRef){entriesRef.doc(id).set(doc).catch(showErr)}
  else{var o=Object.assign({id:id},doc);entries.push(o);lsSave();render()}
  return id;
}
function updateEntry(id,patch){
  if(entriesRef){entriesRef.doc(id).update(patch).catch(showErr)}
  else{entries=entries.map(function(e){return e.id===id?Object.assign({},e,patch):e});lsSave();render()}
}
function removeEntry(id){
  if(entriesRef){entriesRef.doc(id).delete().catch(showErr)}
  else{entries=entries.filter(function(e){return e.id!==id});lsSave();render()}
}
function saveSettings(){
  if(!profileRef){lsSave();return}
  var snap=JSON.parse(JSON.stringify(settingsObj()));
  saving=saving.then(function(){return profileRef.set(snap)}).catch(showErr);
}

/* ---------- toast ---------- */

async function loadRows(){
  var rows;

    rows=entriesRef?(await entriesRef.orderBy("date","desc").limit(1000).get()).docs.map(function(d){return d.data()}):entries;

async function copyTsv(){
  var ta=$("#f-tsv"), err=$("#f-err"), ok=false;
  var done=function(){err.style.color="var(--muted)";err.textContent="コピーしました。スプレッドシートで空いているセルを選んで貼り付けてください"};
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      var item=new ClipboardItem({"text/plain":new Blob([ta.value],{type:"text/plain"}),"text/html":new Blob([htmlTable(lastRows)],{type:"text/html"})});
      await navigator.clipboard.write([item]);ok=true;
    }
  }catch(e){ok=false}
  if(!ok){try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}}
  if(ok){done();return}
  try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);if(document.execCommand("copy")){done();return}}catch(e){}
  err.style.color="";err.textContent="自動でコピーできませんでした。文字を長押しして「すべて選択→コピー」してください";
}

  var csv="﻿"+HEADS.join(",")+"\r\n"+rows.map(function(e){return rowCells(e).map(csvCell).join(",")}).join("\r\n");
  try{await dl.save({filename:"kurecha_"+todayStr()+".csv",data:csv});toast("CSVを保存しました")}

}

function saveBlob(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; a.style.display="none"; document.body.appendChild(a); a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},8000);
}
function fileBase(){

function csvDownload(rows){
  var csv="﻿"+pdfHeads().join(",")+"\r\n"+rows.map(function(e){return rowCells(e).map(csvCell).join(",")}).join("\r\n");
  saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),fileBase()+"_"+todayStr()+".csv");

}
function canvasJpeg(cv){
  return new Promise(function(res,rej){
    cv.toBlob(function(b){
      if(!b) return rej(new Error("jpeg"));
      b.arrayBuffer().then(function(ab){res(new Uint8Array(ab))},rej);
    },"image/jpeg",0.86);
  });
}
async function makePdf(rows){
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready}catch(e){}}
  var W=1240,H=1754,M=70,PAD=10,LH=32,RP=12,HEADH=48;
  var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  var g=cv.getContext("2d");
  var fam=getComputedStyle(document.body).fontFamily||"sans-serif";
  var heads=pdfHeads();
  var cols=[{w:150,a:"l",ml:1},{w:100,a:"l",ml:1},{w:200,a:"l",ml:2},{w:236,a:"l",ml:2},{w:150,a:"r",ml:1},{w:0,a:"l",ml:2}];
  var used=0; cols.forEach(function(c,i){if(i<5)used+=c.w});
  cols[5].w=W-2*M-used;
  var title=APP_TITLE, now=new Date();
  var stamp=now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 出力";
  function font(px,wt){g.font=wt+" "+px+"px "+fam}
  function wrap(text,maxW,maxLines){
    text=String(text==null?"":text);
    var lines=[],cur="",ch;
    var chars=Array.from(text);
    for(var i=0;i<chars.length;i++){
      ch=chars[i];
      if(ch==="\n") continue;
      if(cur&&g.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch}else cur+=ch;
    }
    lines.push(cur);
    if(lines.length>maxLines){
      var last=lines[maxLines-1];
      while(last&&g.measureText(last+"…").width>maxW) last=last.slice(0,-1);
      lines=lines.slice(0,maxLines-1).concat([last+"…"]);
    }
    return lines;
  }
  /* totals by the 2nd column (種別 / 区分) */
  var totals={},order=[];
  rows.forEach(function(e){var c=rowCells(e),k=String(c[1]);if(!(k in totals)){totals[k]=0;order.push(k)}totals[k]+=Number(c[4])||0});
  /* measure rows */
  font(24,500);
  var items=rows.map(function(e){
    var c=rowCells(e), cells=[], n=1;
    for(var i=0;i<6;i++){
      var v=i===4?yen(Number(c[i])||0):String(c[i]==null?"":c[i]);
      var ls=wrap(v,cols[i].w-2*PAD,cols[i].ml);
      cells.push(ls); if(ls.length>n) n=ls.length;
    }
    return {cells:cells,h:n*LH+2*RP};
  });
  /* paginate */
  var topFirst=M+150+order.length*34, topNext=M+10;
  var pages=[],cur=[],y=topFirst+HEADH,limit=H-M-40;
  items.forEach(function(it){
    if(y+it.h>limit&&cur.length){pages.push(cur);cur=[];y=topNext+HEADH}
    cur.push(it); y+=it.h;
  });
  pages.push(cur);
  var N=pages.length, jpegs=[];
  for(var p=0;p<N;p++){
    g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,H);
    g.textBaseline="top";
    var ty;
    if(p===0){
      g.fillStyle="#1A2038"; font(46,900); g.textAlign="left"; g.fillText(title+" 記録一覧",M,M);
      font(24,500); g.fillStyle="#656C8A"; g.fillText(stamp+" ・ "+rows.length+"件",M,M+70);
      font(26,700); g.fillStyle="#1A2038";
      order.forEach(function(k,i){g.fillText(k+"合計  "+yen(totals[k]),M,M+112+i*34)});
      ty=topFirst;
    } else {
      g.fillStyle="#656C8A"; font(22,700); g.textAlign="left"; g.fillText(title+" 記録一覧",M,M-20);
      ty=topNext;
    }
    /* header row */
    g.fillStyle="#EDF0F7"; g.fillRect(M,ty,W-2*M,HEADH);
    font(22,900); g.fillStyle="#1A2038";
    var x=M;
    for(var i=0;i<6;i++){
      g.textAlign=cols[i].a==="r"?"right":"left";
      g.fillText(heads[i],cols[i].a==="r"?x+cols[i].w-PAD:x+PAD,ty+12);
      x+=cols[i].w;
    }
    var yy=ty+HEADH;
    pages[p].forEach(function(it){
      g.strokeStyle="#DADFEC"; g.lineWidth=1.5; g.beginPath(); g.moveTo(M,yy+it.h); g.lineTo(W-M,yy+it.h); g.stroke();
      var xx=M;
      for(var i=0;i<6;i++){
        font(24,i===4?900:500); g.fillStyle="#1A2038";
        if(i===5||i===1) g.fillStyle="#4A5272";
        g.textAlign=cols[i].a==="r"?"right":"left";
        for(var l=0;l<it.cells[i].length;l++){
          g.fillText(it.cells[i][l],cols[i].a==="r"?xx+cols[i].w-PAD:xx+PAD,yy+RP+l*LH);
        }
        xx+=cols[i].w;
      }
      yy+=it.h;
    });
    g.textAlign="center"; font(20,500); g.fillStyle="#9AA2C0";
    g.fillText((p+1)+" / "+N,W/2,H-M+10);
    jpegs.push(await canvasJpeg(cv));
  }
  return buildPdf(jpegs,W,H);
}
function buildPdf(jpegs,W,H){
  var enc=new TextEncoder(), parts=[], offs=[], len=0, n=jpegs.length, objCount=2+n*3;
  function push(u8){parts.push(u8);len+=u8.length}
  function pushS(s){push(enc.encode(s))}
  function obj(id,fn){offs[id]=len;pushS(id+" 0 obj\n");fn();pushS("\nendobj\n")}
  pushS("%PDF-1.4\n");
  obj(1,function(){pushS("<< /Type /Catalog /Pages 2 0 R >>")});
  var kids=[]; for(var i=0;i<n;i++) kids.push((3+3*i)+" 0 R");
  obj(2,function(){pushS("<< /Type /Pages /Count "+n+" /Kids ["+kids.join(" ")+"] >>")});
  jpegs.forEach(function(jp,i){
    var pid=3+3*i, cid=4+3*i, iid=5+3*i, content="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pid,function(){pushS("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>")});
    obj(cid,function(){pushS("<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream")});
    obj(iid,function(){
      pushS("<< /Type /XObject /Subtype /Image /Width "+W+" /Height "+H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jp.length+" >>\nstream\n");
      push(jp); pushS("\nendstream");
    });
  });
  var xo=len;
  pushS("xref\n0 "+(objCount+1)+"\n0000000000 65535 f \n");
  for(var id=1;id<=objCount;id++) pushS(String(offs[id]).padStart(10,"0")+" 00000 n \n");
  pushS("trailer\n<< /Size "+(objCount+1)+" /Root 1 0 R >>\nstartxref\n"+xo+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}
async function exportPdf(){
  var rows=await loadRows(); if(!rows) return;
  toast("PDFを作成中…");
  var blob;
  try{blob=await makePdf(rows)}catch(e){toast("PDFを作成できませんでした");return}
  var name=fileBase()+"_"+todayStr()+".pdf", dl=null;
  try{dl=C&&C.use?await C.use("downloads"):null}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:blob});toast("PDFを保存しました")}
    catch(e){if(!e||e.code!=="declined"){toast("PDFを保存できませんでした。「表をコピー」を使ってください");tsvSheet(rows)}}
    return;
  }
  if(!C){saveBlob(blob,name);toast("PDFのダウンロードを始めました。ダウンロードフォルダを確認してください");return}
  tsvSheet(rows);
}

var IMP={rows:null,res:null};
function impIsCard(){return typeof GROUPS!=="undefined"}
function impParse(text){
  text=String(text||"").replace(/^﻿/,"");
  var first=text.split(/\r?\n/)[0]||"";
  var delim=first.indexOf("\t")>=0?"\t":",";
  var rows=[],row=[],cur="",q=false,i,ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=ch;
    }else if(ch==='"'&&cur===""){q=true}
    else if(ch===delim){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(cur);cur="";
      if(row.length>1||row[0]!=="")rows.push(row);
      row=[];
    }else cur+=ch;
  }
  row.push(cur);
  if(row.length>1||row[0]!=="")rows.push(row);
  return rows;
}
function impZen(s){return String(s==null?"":s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[，、]/g,",").replace(/[－ー−‐]/g,"-")}
function impDate(s){
  s=impZen(s).trim();
  var m=s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  var t=new Date(y,mo-1,d);
  if(t.getMonth()!==mo-1)return null;
  return y+"-"+(mo<10?"0":"")+mo+"-"+(d<10?"0":"")+d;
}
function impAmount(s){
  s=impZen(s).replace(/[¥￥円,\s]/g,"");
  if(!/^\d+(\.\d+)?$/.test(s))return null;
  var n=Math.round(parseFloat(s));
  return n>0?n:null;
}
function impEntryKey(o){return [o.date,o.k,o.label,o.item,o.amount,o.memo].join("\u0001")}
function impBuild(rows){
  var idx={date:0,kind:1,cat:2,item:3,amount:4,memo:5}, hs=0, startRow=null;
  if(rows.length&&rows[0].some(function(c){return String(c).trim()==="日付"})){
    var h=rows[0].map(function(c){return String(c).trim()});

function impExisting(items){

    var hi2=hi.slice(0,8)+"31";
    entriesRef.where("date",">=",lo).where("date","<=",hi2).orderBy("date","desc").limit(1000).get().then(function(snap){

function impExKey(e){

  var inc=isInc(e);

function impPlan(items){
  return impExisting(items).then(function(ex){
    var have={};
    ex.forEach(function(e){var k=impExKey(e);have[k]=(have[k]||0)+1});
    var add=[],dup=0;
    items.forEach(function(o){

function buildPdf(jpegs,W,H){

  function push(u8){parts.push(u8);len+=u8.length}
  function pushS(s){push(enc.encode(s))}

  pushS("%PDF-1.4\n");
  obj(1,function(){pushS("<< /Type /Catalog /Pages 2 0 R >>")});
  var kids=[]; for(var i=0;i<n;i++) kids.push((3+3*i)+" 0 R");
  obj(2,function(){pushS("<< /Type /Pages /Count "+n+" /Kids ["+kids.join(" ")+"] >>")});
  jpegs.forEach(function(jp,i){
    var pid=3+3*i, cid=4+3*i, iid=5+3*i, content="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pid,function(){pushS("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>")});
    obj(cid,function(){pushS("<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream")});
    obj(iid,function(){
      pushS("<< /Type /XObject /Subtype /Image /Width "+W+" /Height "+H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jp.length+" >>\nstream\n");
      push(jp); pushS("\nendstream");

  });

  for(var id=1;id<=objCount;id++) pushS(String(offs[id]).padStart(10,"0")+" 00000 n \n");

}

  function font(px,wt){g.font=wt+" "+px+"px "+fam}
  function wrap(text,maxW,maxLines){
    var lines=[],cur="",chars=Array.from(String(text==null?"":text));
    for(var i=0;i<chars.length;i++){
      var ch=chars[i]; if(ch==="\n") continue;
      if(cur&&g.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch}else cur+=ch;
    }
    lines.push(cur);
    if(lines.length>maxLines){
      var last=lines[maxLines-1];
      while(last&&g.measureText(last+"…").width>maxW) last=last.slice(0,-1);
      lines=lines.slice(0,maxLines-1).concat([last+"…"]);
    }
    return lines;
  }
  var pcent=function(x){return v.total>0?Math.round(x/v.total*100)+"%":"0%"};
  var now=new Date(), stamp=now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 出力";
  var title="自由費 合算 "+ym.slice(0,4)+"年"+Number(ym.slice(5))+"月";
  function rowDraw(cols,texts,y,h,bold,color){
    g.strokeStyle="#DADFEC"; g.lineWidth=1.5; g.beginPath(); g.moveTo(M,y+h); g.lineTo(W-M,y+h); g.stroke();
    var x=M;
    for(var i=0;i<cols.length;i++){
      font(24,bold&&bold[i]?900:500); g.fillStyle=color&&color[i]||"#1A2038";
      g.textAlign=cols[i].a==="r"?"right":"left";
      for(var l=0;l<texts[i].length;l++) g.fillText(texts[i][l],cols[i].a==="r"?x+cols[i].w-PAD:x+PAD,y+RP+l*LH);
      x+=cols[i].w;
    }
  }
  function headDraw(cols,names,y){
    g.fillStyle="#EDF0F7"; g.fillRect(M,y,W-2*M,HEADH);
    font(22,900); g.fillStyle="#1A2038";
    var x=M;
    for(var i=0;i<cols.length;i++){
      g.textAlign=cols[i].a==="r"?"right":"left";
      g.fillText(names[i],cols[i].a==="r"?x+cols[i].w-PAD:x+PAD,y+12);
      x+=cols[i].w;
    }
  }
  var ops=[];
  ops.push({h:130,draw:function(y){
    g.textAlign="left"; g.fillStyle="#1A2038"; font(46,900); g.fillText(title,M,y);
    font(24,500); g.fillStyle="#656C8A"; g.fillText(stamp+" ・ "+v.cur.length+"件",M,y+70);
  }});
  ops.push({h:64,draw:function(y){g.textAlign="left"; g.fillStyle="#1A2038"; font(36,900); g.fillText("合計  "+yen(v.total),M,y)}});
  ops.push({h:46,draw:function(y){g.textAlign="left"; g.fillStyle="#1A2038"; font(26,700);
    g.fillText("あそび帳 "+yen(v.tp)+"("+pcent(v.tp)+")  ・  クレカ帳の自由費 "+yen(v.tc)+"("+pcent(v.tc)+")",M,y)}});
  ops.push({h:30,draw:function(){}});
  /* category table */
  var ccols=[{w:430,a:"l"},{w:220,a:"r"},{w:220,a:"r"},{w:0,a:"r"}]; ccols[3].w=W-2*M-870;
  var chead={h:HEADH,isHead:true,draw:function(y){headDraw(ccols,["分類(同じ名前は合算)","あそび帳","クレカ帳","合計"],y)}};
  ops.push({h:56,need:56+HEADH+56,reset:true,draw:function(y){g.textAlign="left"; g.fillStyle="#1A2038"; font(28,900); g.fillText("分類ごと",M,y)}});
  ops.push(chead);
  font(24,500);
  v.rows.forEach(function(r){
    var t=[wrap(r.name,ccols[0].w-2*PAD,1),[yen(r.play)],[yen(r.card)],[yen(r.total)]];
    ops.push({h:LH+2*RP,draw:function(y){rowDraw(ccols,t,y,LH+2*RP,{3:1})}});
  });
  var totalT=[["合計"],[yen(v.tp)],[yen(v.tc)],[yen(v.total)]];
  ops.push({h:LH+2*RP,draw:function(y){rowDraw(ccols,totalT,y,LH+2*RP,{0:1,1:1,2:1,3:1})}});
  ops.push({h:36,draw:function(){}});
  /* detail table */
  var dcols=[{w:150,a:"l",ml:1},{w:132,a:"l",ml:1},{w:200,a:"l",ml:2},{w:220,a:"l",ml:2},{w:150,a:"r",ml:1},{w:0,a:"l",ml:2}];
  var used=0; dcols.forEach(function(c,i){if(i<5)used+=c.w}); dcols[5].w=W-2*M-used;
  var dhead={h:HEADH,isHead:true,draw:function(y){headDraw(dcols,HEADS,y)}};
  ops.push({h:56,need:56+HEADH+56,reset:true,draw:function(y){g.textAlign="left"; g.fillStyle="#1A2038"; font(28,900); g.fillText("明細",M,y)}});
  ops.push(dhead);
  font(24,500);
  v.list.forEach(function(e){
    var c=cells(e), t=[], n=1;
    for(var i=0;i<6;i++){
      var val=i===4?yen(c[i]):String(c[i]==null?"":c[i]);
      var ls=wrap(val,dcols[i].w-2*PAD,dcols[i].ml); t.push(ls); if(ls.length>n) n=ls.length;
    }
    var h=n*LH+2*RP;
    ops.push({h:h,draw:function(y){rowDraw(dcols,t,y,h,{4:1},{1:"#4A5272",5:"#4A5272"})}});
  });
  /* paginate */
  var pages=[[]], y=M, head=null;
  ops.forEach(function(op){
    if(op.reset) head=null;
    var cur=pages[pages.length-1];
    if(y+(op.need||op.h)>limit&&cur.length){
      pages.push([]); y=M;
      if(head&&!op.isHead){pages[pages.length-1].push(head); y+=head.h}
    }
    pages[pages.length-1].push(op); y+=op.h;
    if(op.isHead) head=op;
  });
  var N=pages.length, jpegs=[];
  for(var p=0;p<N;p++){
    g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,H); g.textBaseline="top";
    var yy=M;
    pages[p].forEach(function(op){op.draw(yy); yy+=op.h});
    g.textAlign="center"; font(20,500); g.fillStyle="#9AA2C0"; g.fillText((p+1)+" / "+N,W/2,H-M+10);
    jpegs.push(await canvasJpeg(cv));
  }
  return buildPdf(jpegs,W,H);
}
function showCopy(){
  var v=lastView; var box=$("#sx-copy"); if(!v||!box) return;
  box.innerHTML='<p class="hint">「コピー」を押して、スプレッドシートなどに貼り付けてください。空いているセル(A1など)を選んだ状態で貼り付けると、列ごとに分かれて入ります。</p>'+
    '<textarea id="sx-ta" class="field" rows="7" readonly style="font-size:12px;line-height:1.5;white-space:pre;margin-top:8px"></textarea>'+
    '<div class="rowbtns" style="margin-top:8px"><button class="btn" data-sx="copy">コピー</button></div>';
  $("#sx-ta").value=tsvText(v);
}
async function copyText(){
  var v=lastView, ta=$("#sx-ta"); if(!v||!ta) return;
  var ok=false;
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([ta.value],{type:"text/plain"}),"text/html":new Blob([htmlTable(v)],{type:"text/html"})})]);ok=true;
    }
  }catch(e){ok=false}
  if(!ok){try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}}
  if(!ok){try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);ok=document.execCommand("copy")}catch(e){}}
  msg(ok?"コピーしました。スプレッドシートで空いているセルを選んで貼り付けてください":"自動でコピーできませんでした。文字を長押しして「すべて選択→コピー」してください");
}
async function exportSum(kind){
  var v=lastView; if(!v||!v.cur.length){msg("この月の記録がありません");return}
  if(kind==="tsv"){showCopy();return}
  var base="yuukyouhi_gassan_"+ym, blob, name;
  if(kind==="csv"){blob=new Blob([csvText(v)],{type:"text/csv;charset=utf-8"});name=base+".csv"}
  else{
    msg("PDFを作成中…");
    try{blob=await makeSumPdf(v)}catch(e){msg("PDFを作成できませんでした");return}
    name=base+".pdf";
  }
  var dl=null;
  try{dl=C&&C.use?await C.use("downloads"):null}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:blob});msg("保存しました")}
    catch(e){if(!e||e.code!=="declined"){msg("保存できませんでした。下の表をコピーして使ってください");showCopy()}}
    return;
  }
  if(!C){saveBlob(blob,name);msg("ダウンロードを始めました。ダウンロードフォルダを確認してください");return}
  msg("この画面では保存できません。下の表をコピーして使ってください");showCopy();
}
ROOT.addEventListener("click",function(ev){
  var x=ev.target.closest("[data-sx]");
  if(x){ if(x.dataset.sx==="copy") copyText(); else exportSum(x.dataset.sx); return }
  var t=ev.target.closest("[data-sm]"); if(!t) return;
  ym=addMonths(ym,Number(t.dataset.sm)); load();
});
document.addEventListener("sumshow",function(){load()});
if(!ROOT.hidden) load();
})();
</script>
